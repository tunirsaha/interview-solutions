<div class="row justify-content-center">
  <div class="col-md-4">
    <h3 class="text-center">Register</h3>
    <form (ngSubmit)="register()" #f="ngForm">
      <div class="mb-3">
        <input type="text" class="form-control" name="name" [(ngModel)]="name" required placeholder="Full Name" />
      </div>
      <div class="mb-3">
        <div class="input-group">
          <input type="email" class="form-control" name="email" [(ngModel)]="email" required placeholder="Email" [readonly]="emailPrefilled" />
          @if (emailPrefilled) {
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          }
        </div>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" name="password" [(ngModel)]="password" required placeholder="Password" />
      </div>
      <div class="mb-3">
        <div class="input-group">
          <input type="text" class="form-control" name="inviteToken" [(ngModel)]="inviteToken" required placeholder="Invite Token" [readonly]="inviteTokenPrefilled" />
          @if (inviteTokenPrefilled) {
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          }
        </div>
      </div>
      <button class="btn btn-primary w-100" [disabled]="f.invalid" type="submit">Register</button>
    </form>

    <div class="text-center mt-3">
      <a routerLink="/login">Already have an account? Login</a>
    </div>
  </div>
</div>
