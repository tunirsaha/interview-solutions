<div class="row justify-content-center">
  <div class="col-md-4">
    <h3 class="text-center">Update Password</h3>
    <form (ngSubmit)="submit()" #f="ngForm">
      <div class="mb-3">
        <input type="password" class="form-control" name="current" [(ngModel)]="current" required placeholder="Current Password" />
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" name="new1" [(ngModel)]="new1" required placeholder="New Password" />
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" name="new2" [(ngModel)]="new2" required placeholder="Confirm New Password" />
      </div>
      <button class="btn btn-primary w-100" [disabled]="f.invalid" type="submit">Update</button>
    </form>
  </div>
</div>
