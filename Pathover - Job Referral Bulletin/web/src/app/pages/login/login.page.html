<div class="row justify-content-center">
  <div class="col-md-4">
    <h3 class="text-center">Login</h3>
    <form (ngSubmit)="login()" #f="ngForm">
      <div class="mb-3">
        <input type="email" class="form-control" name="email" [(ngModel)]="email" required placeholder="Email" />
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" name="password" [(ngModel)]="password" required placeholder="Password" />
      </div>
      <button class="btn btn-primary w-100" [disabled]="f.invalid" type="submit">Login</button>
    </form>

    <div class="text-center mt-3">
      <a routerLink="/register">Create an account (Invite Only)</a>
    </div>
  </div>
</div>
